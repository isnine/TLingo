  </div>

  <div style="margin-top: 16px; flex-grow: 1; min-height: 0; background: #ffffff; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 18px">

      <span style="font-size: 13px; line-height: 1.4; color: rgba(0, 0, 0, 0.6)">Could you tell me how to get to the station?</span>

    </div>

    <div style="flex-grow: 1"></div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="display: inline-flex; align-items: center; gap: 10px">
        <span style="display: inline-flex; align-items: center; gap: 3px; height: 24px" aria-hidden="true">
          <span style="width: 3px; height: 8px; border-radius: 2px; background: #3c68f7"></span>
          <span style="width: 3px; height: 18px; border-radius: 2px; background: #3c68f7"></span>

          <span style="width: 3px; height: 22px; border-radius: 2px; background: #3c68f7"></span>
          <span style="width: 3px; height: 14px; border-radius: 2px; background: #3c68f7"></span>
          <span style="width: 3px; height: 6px; border-radius: 2px; background: #3c68f7"></span>

        <span style="font-size: 13px; font-weight: 500; color: rgba(0, 0, 0, 0.6)">Listening</span>
      </span>
      <button type="button" aria-label="Stop listening" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: #cf4a4a; color: #ffffff; display: flex; align-items: center; justify-content: center">

  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; font-size: 13px; font-weight: 500; color: #1c1c22">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2aa05a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>

    <button type="button" style="height: 52px; border: 0; border-radius: 9999px; background: #3c68f7; color: #ffffff; font-size: 17px; font-weight: 600">Continue</button>
    <button type="button" style="height: 44px; border: 0; background: transparent; color: rgba(0, 0, 0, 0.6); font-size: 15px; font-weight: 500">Back</button>
